# Linux AppImage on Ubuntu 24.04 (glibc 2.39), so it runs on Ubuntu 24.04+, Fedora 40+, SteamOS...
#   git tag v0.60.6-linux && git push origin v0.60.6-linux   builds and publishes the release
#   Actions > Linux release > Run workflow                     builds only (artifact, no release)
name: Linux release

on:
  push:
    tags: ['v*-linux*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Newest glibc symbol the AppImage may need: what Ubuntu 24.04 has.
  MAX_GLIBC: '2.39'

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Distribution packages
        run: bash packaging/linux/ci_deps.sh apt

      # SDL3, Vulkan-Headers, VMA, robin-map and Zydis are built from source once per version
      # set (the key follows ci_deps.sh).
      - name: Cache source dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ~/sotc-deps   # ci_deps.sh's DEPS_PREFIX
          key: sotc-deps-ubuntu-24.04-${{ hashFiles('packaging/linux/ci_deps.sh') }}

      - name: Source dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash packaging/linux/ci_deps.sh source

      - name: Cache minimal FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: out/ffmpeg
          key: sotc-ffmpeg-ubuntu-24.04-${{ hashFiles('packaging/linux/build_ffmpeg.sh') }}

      - name: Minimal FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash packaging/linux/build_ffmpeg.sh

      - name: Build
        run: |
          source packaging/linux/ci_deps.sh env
          ./build.sh

      - name: AppImage
        run: |
          source packaging/linux/ci_deps.sh env
          bash packaging/linux/build_appimage.sh
          ls -l dist/

      - name: Check the glibc it needs
        run: |
          appimage=$(ls dist/*.AppImage)
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          newest=$(find squashfs-root -type f -exec objdump -T {} + 2>/dev/null |
                   grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "Newest glibc symbol: $newest (allowed: $MAX_GLIBC)"
          if [[ $(printf '%s\n%s\n' "$newest" "$MAX_GLIBC" | sort -V | tail -1) != "$MAX_GLIBC" ]]; then
              echo "::error::The AppImage needs glibc $newest, newer than $MAX_GLIBC"
              exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SotC-PC-linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.AppImage --clobber
          else
              gh release create "$TAG" dist/*.AppImage --title "$TAG" --generate-notes
          fi
